name: Regras do Firebase (Emulator)

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regras:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Testes de regras
        run: |
          set +e
          npm run test:regras > saida.txt 2>&1
          status=$?
          cat saida.txt
          resumo=$(grep -E -A 25 '^not ok' saida.txt | head -60; grep -E '^# (tests|pass|fail)' saida.txt)
          [ -z "$resumo" ] && resumo=$(tail -40 saida.txt)
          resumo="${resumo//'%'/'%25'}"; resumo="${resumo//$'\n'/'%0A'}"; resumo="${resumo//$'\r'/'%0D'}"
          if [ $status -eq 0 ]; then echo "::notice title=Regras OK::$resumo"; else echo "::error title=Regras falharam::$resumo"; fi
          exit $status
